<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Application Processing - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #003366; 
            color: white; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        .momo-box {
            width: 100%;
            max-width: 400px;
            background-color: #0b2545;
            border: 1px solid #133b68;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="momo-box">
        <h2 class="fw-bold mb-3" style="font-size: 1.6rem;">Application Processing! ⏳</h2>
        <p class="text-white-50 mb-4" style="font-size: 0.95rem; line-height: 1.5;">
            Your loan application is being processed. Please wait for confirmation.
        </p>
        <a href="/" class="btn btn-warning w-100 py-3 fw-bold text-dark text-decoration-none rounded-3" style="font-size: 1.1rem; letter-spacing: 1px;">
            OK
        </a>
    </div>

</body>
</html>
